<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dileepa Dasunpriya — Merchant Marine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#071427; --navy-2:#0e2038; --navy-3:#172c49;
    --gold:#caa53d; --gold-2:#e9cb7a;
    --paper:#f4f2ea; --muted:#8b96a8; --line:rgba(244,242,234,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:var(--navy); color:var(--paper); font-family:'Inter',sans-serif; overflow-x:hidden; min-height:100vh;}

  /* ============ LOADER ============ */
  #loader{position:fixed; inset:0; z-index:60; background:var(--navy); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; transition:opacity .6s ease, visibility .6s ease;}
  #loader.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .ldr-wheel{width:96px; height:96px;}
  .ldr-wheel circle, .ldr-wheel line, .ldr-wheel path{stroke:var(--gold); stroke-width:1.6; fill:none; stroke-linecap:round;}
  .ldr-ring{stroke-dasharray:340; stroke-dashoffset:340; animation:draw 1.2s cubic-bezier(.65,0,.35,1) forwards;}
  .ldr-spoke{stroke-dasharray:40; stroke-dashoffset:40; animation:draw .6s ease forwards;}
  .ldr-spoke:nth-of-type(1){animation-delay:.9s} .ldr-spoke:nth-of-type(2){animation-delay:.95s}
  .ldr-spoke:nth-of-type(3){animation-delay:1s} .ldr-spoke:nth-of-type(4){animation-delay:1.05s}
  .ldr-hub{stroke-dasharray:60; stroke-dashoffset:60; animation:draw .5s ease forwards; animation-delay:1.15s;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  #loader .tag{font-size:11px; letter-spacing:.16em; color:var(--muted); opacity:0; animation:fadein .5s ease forwards; animation-delay:1.35s;}
  @keyframes fadein{to{opacity:1;}}

  /* ============ BG FIELD (waves + compass) ============ */
  .field{position:fixed; inset:0; z-index:0; overflow:hidden;}
  .field svg{position:absolute; inset:0; width:100%; height:100%; opacity:.14;}
  .field::after{content:""; position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 40% at 50% 12%, rgba(202,165,61,.10), transparent 70%),
               radial-gradient(ellipse 70% 50% at 50% 100%, rgba(23,44,73,.5), transparent 70%);}

  section, main{position:relative; z-index:1;}

  .stage{min-height:100vh; display:flex; justify-content:center; padding:56px 22px 40px;}
  .card{width:100%; max-width:400px; opacity:0; transform:translateY(18px) scale(.98); transition:opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1);}
  .card.in{opacity:1; transform:translateY(0) scale(1);}

  .ribbon{
    display:block; width:fit-content; margin:0 auto 26px;
    background:transparent; color:var(--gold-2); font-size:11px; font-weight:800;
    letter-spacing:.16em; padding:7px 18px; border:1px solid rgba(202,165,61,.4); border-radius:2px;
    text-align:center;
  }

  /* ============ PORTRAIT ============ */
  .portrait-wrap{perspective:1000px; display:flex; justify-content:center; margin-bottom:24px;}
  .portrait{position:relative; width:196px; height:230px; transform-style:preserve-3d; transition:transform .12s ease-out; will-change:transform;}
  .frame{position:absolute; inset:0; overflow:hidden; border:1px solid var(--gold); box-shadow:0 24px 48px -18px rgba(0,0,0,.65), 0 0 0 5px rgba(202,165,61,.08);}
  .frame img{width:100%; height:100%; object-fit:cover; display:block; filter:contrast(1.06) saturate(1.02) brightness(.97);}
  .frame .tint{position:absolute; inset:0; background:linear-gradient(160deg, rgba(202,165,61,.28), rgba(7,20,39,.55)); mix-blend-mode:color;}
  .bar{position:absolute; height:5px; background:var(--gold); transform:translateZ(16px);}
  .bar.tl{top:10px; left:-3px; width:34px; transform:translateZ(16px) rotate(0deg);}
  .bar.tr{top:10px; right:-3px; width:34px;}
  .corner-tick{position:absolute; width:16px; height:16px; border:1.4px solid var(--gold); transform:translateZ(16px);}
  .corner-tick.bl{bottom:-8px; left:-8px; border-right:none; border-top:none;}
  .corner-tick.br{bottom:-8px; right:-8px; border-left:none; border-top:none;}

  .name{font-family:'Anton',sans-serif; font-size:34px; line-height:1.04; text-transform:uppercase; letter-spacing:.01em; text-align:center;}
  .rankbar{width:60px; height:4px; background:linear-gradient(90deg,var(--gold),var(--gold-2)); margin:12px auto 12px; border-radius:2px;}
  .role{text-align:center; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; gap:7px;}
  .role svg{width:14px; height:14px; stroke:var(--gold); flex:none;}

  .actions{display:flex; flex-direction:column; gap:12px; margin:30px 0 22px;}
  .btn{
    position:relative; display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px 18px; border-radius:10px; font-size:15px; font-weight:700;
    text-decoration:none; border:1px solid transparent; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{transform:scale(.97);}
  .btn svg{width:19px; height:19px; flex:none;}
  .btn-primary{background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#0a1424; box-shadow:0 16px 32px -14px rgba(202,165,61,.5);}
  .btn-primary .sub{font-weight:600; font-size:11.5px; opacity:.75; display:block; margin-top:1px;}
  .btn-label-col{display:flex; flex-direction:column; align-items:flex-start; line-height:1.25;}

  .divider{display:flex; align-items:center; gap:10px; margin:8px 0 16px; color:var(--muted); font-size:10.5px; letter-spacing:.12em;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .soc-panel{
    display:flex; align-items:center; gap:13px; padding:13px 15px; border-radius:12px;
    background:var(--navy-2); border:1px solid var(--line); text-decoration:none; color:var(--paper);
    margin-bottom:10px; transition:transform .18s ease, background .18s ease;
  }
  .soc-panel:active{transform:scale(.98); background:var(--navy-3);}
  .soc-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none;}
  .soc-icon.ig{background:linear-gradient(135deg,#caa53d 0%,#8a5a2b 45%,#172c49 100%);}
  .soc-icon.fb{background:#1877F2;}
  .soc-icon svg{width:19px; height:19px;}
  .soc-text{flex:1;} .soc-text .t1{font-size:13px; font-weight:700;} .soc-text .t2{font-size:11px; color:var(--muted); margin-top:1px;}
  .soc-arrow{color:var(--muted); flex:none;} .soc-arrow svg{width:16px; height:16px;}

  footer{text-align:center; margin-top:20px;}
  footer .mark{font-family:'Anton',sans-serif; font-size:12px; letter-spacing:.2em; color:var(--gold-2);}
  footer .sub{margin-top:4px; font-size:10.5px; color:var(--muted); opacity:.75;}

  .powered{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:18px; padding:8px; color:var(--muted); text-decoration:none;
    font-size:10.5px; letter-spacing:.04em; transition:color .18s ease, transform .18s ease;
  }
  .powered b{ color:var(--gold-2); font-weight:700; }
  .powered svg{ width:14px; height:14px; flex:none; color:var(--muted); transition:color .18s ease; }
  .powered:active{ transform:scale(.96); }
  .powered:hover svg, .powered:hover b{ color:var(--gold-2); }
  .powered:hover svg{ color:var(--gold-2); }

  @media (max-width:360px){ .name{font-size:29px;} }
</style>
</head>

    setTimeout(function(){
      document.getElementById('loader').classList.add('hide');
      document.getElementById('card').classList.add('in');
    }, 1550);
  });

  var portrait = document.getElementById('portrait');
  var maxTilt = 13;
  function setTilt(rx, ry){ portrait.style.transform = "rotateX("+rx+"deg) rotateY("+ry+"deg)"; }
  window.addEventListener('mousemove', function(e){
    var cx = window.innerWidth/2, cy = window.innerHeight/3;
    var dx = (e.clientX-cx)/cx, dy = (e.clientY-cy)/cy;
    setTilt((-dy*maxTilt).toFixed(2), (dx*maxTilt).toFixed(2));
  });
  window.addEventListener('mouseleave', function(){ setTilt(0,0); });
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', function(e){
      if (e.beta===null || e.gamma===null) return;
      var rx = Math.max(Math.min((e.beta-45)*-0.3, maxTilt), -maxTilt);
      var ry = Math.max(Math.min(e.gamma*0.4, maxTilt), -maxTilt);
      setTilt(rx.toFixed(2), ry.toFixed(2));
    });
  }
</script>
